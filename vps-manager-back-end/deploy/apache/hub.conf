ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300
ServerName localhost

AddType application/javascript .js .mjs
AddType text/css .css
AddType application/wasm .wasm

<Location /api>
    ProxyPass http://host.docker.internal:3001/api
    ProxyPassReverse http://host.docker.internal:3001/api
</Location>

<Location /health>
    ProxyPass http://host.docker.internal:3001/health
    ProxyPassReverse http://host.docker.internal:3001/health
</Location>

ProxyPass /ws ws://host.docker.internal:3001/ws
ProxyPassReverse /ws ws://host.docker.internal:3001/ws

# Acesso local (:8081) lista os projetos.
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1 vps-hub.com.br
    DocumentRoot /usr/local/apache2/htdocs
</VirtualHost>

# Domínio público abre o app em /central-apps-hub/.
<VirtualHost *:80>
    ServerName central-apps-hub.com.br
    ServerAlias www.central-apps-hub.com.br
    DocumentRoot /usr/local/apache2/htdocs
    RedirectMatch ^/$ /central-apps-hub/
</VirtualHost>

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    IndexOptions FancyIndexing HTMLTable FoldersFirst
    AllowOverride None
    Require all granted
</Directory>

<Directory "/usr/local/apache2/htdocs/central-apps-hub">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /central-apps-hub/index.html
</Directory>
